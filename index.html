<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plataforma Verificada</title>
  <meta name="robots" content="noindex,nofollow">

  <!-- Meta Pixel -->
  <script>
    !function(f,b,e,v,n,t,s){
      if(f.fbq)return;
      n=f.fbq=function(){
        n.callMethod ? n.callMethod.apply(n,arguments) : n.queue.push(arguments)
      };
      if(!f._fbq)f._fbq=n;
      n.push=n;
      n.loaded=!0;
      n.version='2.0';
      n.queue=[];
      t=b.createElement(e); t.async=!0;
      t.src=v;
      s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s);
    }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', '869130839351005');
    fbq('track', 'PageView');
  </script>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto;
      background:#050814;
      color:#fff;
      text-align:center;
    }
    .box{
      max-width:420px;
      padding:20px;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Conectando con WhatsApp…</h2>
    <p>En segundos te atendemos.</p>
  </div>

  <script>
    const PHONE = "5492236799127";
    const TEXT  = "Hola 🦢 vengo desde el anuncio y quiero acceso a la plataforma.";

    function firePixel(){
      try{
        if (typeof fbq === "function") {
          fbq('track', 'Contact');
          fbq('track', 'Purchase', { currency:'USD', value:1.00 });
        }
      }catch(e){}
    }

    function openWhatsApp(){
      const encoded = encodeURIComponent(TEXT);

      // Deep link (apps instaladas)
      const appLink = `whatsapp://send?phone=${PHONE}&text=${encoded}`;

      // Fallback web
      const webLink = `https://wa.me/${PHONE}?text=${encoded}`;

      // Intento 1: abrir app
      window.location.href = appLink;

      // Fallback automático
      setTimeout(() => {
        window.location.href = webLink;
      }, 900);
    }

    // Ejecuta todo
    firePixel();

    // Delay óptimo para que Meta registre
    setTimeout(() => {
      openWhatsApp();
    }, 800);
  </script>
</body>
</html>
